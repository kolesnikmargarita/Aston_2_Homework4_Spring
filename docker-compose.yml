version: '3.9'

services:
  database:
    image: postgres:16
    container_name: database
    ports:
      - '5432:5432'
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - database-network


  kafka:
    image: apache/kafka:latest
    container_name: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: CONTROLLER://0.0.0.0:29092,INTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - kafka-network

  config-server:
    build:
      context: .
      target: config-server
    image: config-server:0.0.1
    ports:
      - '8888:8888'
    volumes:
      - ./microservices-config:/app/config:ro
    environment:
      - SPRING_PROFILES_ACTIVE=native
      - SPRING_CLOUD_CONFIG_SERVER_NATIVE_SEARCH_LOCATIONS=file:/app/config/
      - EMAIL_ADDRESS=${EMAIL_ADDRESS}
      - EMAIL_PASSWORD=${EMAIL_PASSWORD}
      - DB_NAME=${DB_NAME}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
    networks:
      - internal-network
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8888/user-service/default" ]
      interval: 15s
      timeout: 5s
      retries: 3


  discovery-service:
    build:
      context: .
      target: discovery-service
    image: discovery-service:0.0.1
    ports:
      - '8761:8761'
    networks:
      - internal-network
    depends_on:
      config-server:
        condition: service_healthy

  gateway-service:
    build:
      context: .
      target: gateway-service
    image: gateway-service:0.0.1
    ports:
      - '8080:8080'
    networks:
      - public-network
      - internal-network
    depends_on:
      config-server:
        condition: service_healthy
      discovery-service:
        condition: service_started

  user-service:
    build:
      context: .
      target: user-service
    image: user-service:0.0.1
    ports:
      - '8081:8081'
    environment:
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      CONFIG_SERVER_URL: http://config-server:8888
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      database:
        condition: service_started
      config-server:
        condition: service_healthy
      discovery-service:
        condition: service_started
    networks:
      - database-network
      - kafka-network
      - internal-network

  notification-service:
    build:
      context: .
      target: notification-service
      args:
        - EMAIL_ADDRESS=${EMAIL_ADDRESS}
        - EMAIL_PASSWORD=${EMAIL_PASSWORD}
    image: notification-service:0.0.1
    ports:
      - '8082:8082'
    environment:
      EMAIL_ADDRESS: ${EMAIL_ADDRESS}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD}
      CONFIG_SERVER_URL: http://config-server:8888
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_started
      config-server:
        condition: service_healthy
      discovery-service:
        condition: service_started
    networks:
      - kafka-network
      - internal-network

volumes:
  postgres_data:

networks:
  kafka-network:
    driver: bridge
  database-network:
    driver: bridge
  public-network:
    driver: bridge
  internal-network:
    driver: bridge